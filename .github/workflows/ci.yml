name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt update && sudo apt install -y just npm yamllint shellcheck shfmt
      - run: go install github.com/google/yamlfmt/cmd/yamlfmt@latest
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: npm install -g prettier prettier-plugin-sh yaml-language-server
      - run: test -z "$(gofmt -l .)"
      - run: just --fmt --check --unstable
      - run: yamlfmt -lint .
      - run: prettier --check "**/*.{md,json,jsonc}" --ignore-path .prettierignore
      - run: yamllint .
      - run: go vet ./...
      - run: go test ./...
      - run: actionlint
      - run: go build -o bin/uboot ./cmd/uboot
      - run: ./bin/uboot --list
