# Direct binary installs handled by uboot itself. This is intentionally small:
# it only bootstraps the `binstaller` CLI (which then installs every other dev
# binary from configs/binstaller/) plus helm and kustomize, whose upstream
# install scripts binstaller cannot express (it rejects shell installer blocks).
assets:
  - id: binstaller
    root: ${HOME}/.local/share/uboot/apps
    links: ${HOME}/.local/bin
    tools:
      - name: binstaller
        version: v0.1.1
        url: https://github.com/worxbend/binstaller/releases/download/v0.1.1/binstaller-v0.1.1-linux-amd64.tar.gz
        archive: tar.gz
        sha256: a9f7c10f01e06e61e248096d4ba0f6cf7aeb63c31445d9fc377fff786380a7bc
        binaries: [binstaller]

  - id: k8s-script-tools
    root: ${HOME}/.local/share/uboot/apps
    links: ${HOME}/.local/bin
    tools:
      - name: helm
        version: latest
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        archive: helm-script
        binaries: [helm]
      - name: kustomize
        version: latest
        url: https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh
        archive: kustomize-script
        binaries: [kustomize]
